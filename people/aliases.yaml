# Maps emails, GitHub logins, and GitLab usernames onto one person.
# Matching is case-insensitive. An author who matches none of these is kept
# as a distinct identity with unmapped: true. They are not dropped.
#
# Add a person by appending an entry. Use the same id for every login that
# person uses, or the per-person report will split them.
#
# GitLab username for Xiaodong is intentionally empty: it was not verified
# when this file was created (no GitLab token in the environment). Add it
# under gitlab_usernames once you know it. The GitHub login is the owner of
# xdlab2026/source-code-report. The email is GitHub's private noreply form
# for that account (id 262348385). Add any other commit emails you see.
people:
  - id: xiaodong-zhou
    display_name: Xiaodong Zhou
    emails:
      - 262348385+xdlab2026@users.noreply.github.com
    github_logins:
      - xdlab2026
    gitlab_usernames: []
