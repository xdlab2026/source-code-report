# Maps emails, GitHub logins, and GitLab usernames onto one person.
# Matching is exact and case-insensitive: email, then GitHub login, then
# GitLab username. Nothing is merged by a similar name.
#
# GitLab commits carry only the author email, not the GitLab username, so a
# GitLab contributor must be listed by email to be matched on commits.
#
# A new identity is printed as a ready-to-paste snippet in the PDF Identity
# mapping section and in the Actions log. Paste it here, then set id and
# display_name to the real person. Use one id for every email and login
# that person uses.
#
# Tool authors (Claude, Cursor, Copilot, AppBuilder Bot, Tessera Build Bot)
# are not listed. A tool commit is credited to a human Co-authored-by trailer,
# or else to the pull request or merge request author. With neither, it stays
# in the Identity mapping section.
#
# CI/CD system accounts (Vista CI, ci@vistajet.io) are not listed either:
# their commits are dropped before scoring (src/collectors/shared.ts).
#
# Watson X machine emails below are Xiaodong's. A new Watson X email that
# is not listed stays unmapped.
