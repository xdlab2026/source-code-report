name: Weekly engineering report

on:
  schedule:
    # Monday 00:00 UTC. That is 04:00 in Asia/Dubai (UTC+4, no daylight saving).
    # In Europe/Malta this is 01:00 Monday in winter and 02:00 Monday in summer,
    # so the weekly weekday gate still opens.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      window:
        description: "Window for this manual run. 7d is last week. 24h is the past 24 hours."
        required: false
        default: 7d
        type: choice
        options:
          - 7d
          - 24h

permissions:
  contents: read

concurrency:
  group: engineering-activity-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome for the PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates fonts-liberation
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
      - uses: actions/cache@v6
        with:
          path: state
          key: report-delivery-state-${{ github.run_id }}
          restore-keys: |
            report-delivery-state-
      - name: Run report
        env:
          WINDOW_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.window || 'config' }}
          GH_READONLY_TOKEN: ${{ secrets.GH_READONLY_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          args=(--deliver)
          if [ "$WINDOW_OVERRIDE" = "24h" ] || [ "$WINDOW_OVERRIDE" = "7d" ]; then
            args+=(--window "$WINDOW_OVERRIDE")
          else
            args+=(--scheduled)
          fi
          npm run report -- "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engineering-activity-report
          path: out/
          if-no-files-found: ignore
